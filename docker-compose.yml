version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sre-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sre-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:15-alpine
    container_name: sre-postgres
    environment:
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: sre_password
      POSTGRES_DB: incidents_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d incidents_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    container_name: sre-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sre_user:sre_password@postgres:5432/incidents_db
      - CONFLUENT_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  enrichment-worker:
    build:
      context: ./enrichment-worker
    container_name: sre-worker
    environment:
      - DATABASE_URL=postgresql://sre_user:sre_password@postgres:5432/incidents_db
      - CONFLUENT_BOOTSTRAP_SERVERS=kafka:29092
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  producer:
    build:
      context: ./producer
    container_name: sre-producer
    environment:
      - CONFLUENT_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    container_name: sre-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - HOST=0.0.0.0
    command: npm run dev -- --host
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
